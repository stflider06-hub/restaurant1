<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дастархан — админка меню</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFFFF; --bg-alt:#F8F8F8; --bg-card:#FFFFFF; --ink:#1C1C1C; --ink-soft:#6B6B6B; --line:#E5E7EB;
  --primary:#8B0000; --primary-dark:#A30000; --accent:#C1121F; --primary-soft:#F5E6E6;
  --green:#1E7A3D; --green-soft:#E3F3E8; --red:#C1121F; --red-soft:#FBEAEA;
  --shadow-sm: 0 1px 3px rgba(28,28,28,0.06), 0 1px 2px rgba(28,28,28,0.04);
  --shadow-md: 0 8px 24px rgba(28,28,28,0.08);
  --shadow-lg: 0 16px 40px rgba(28,28,28,0.14);
  --radius-sm:16px; --radius-md:20px; --radius-lg:24px;
  --font-display:'Outfit',sans-serif; --font-body:'Manrope',sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--font-body); background:var(--bg-alt); color:var(--ink); min-height:100vh; padding-bottom:60px; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; cursor:pointer; }
h1,h2,h3{ font-family:var(--font-display); font-weight:800; }
.container{ max-width:980px; margin:0 auto; padding:0 20px; }

/* header */
.topbar{ background:var(--bg-card); color:var(--ink); padding:20px 0; margin-bottom:28px; border-bottom:1px solid var(--line); }
.topbar .container{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.topbar-brand{ display:flex; align-items:center; gap:12px; }
.topbar-mark{ width:38px; height:38px; border-radius:50%; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; }
.topbar-mark svg{ width:65%; height:65%; }
.topbar-title{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; color:var(--ink); }
.topbar-sub{ font-size:0.78rem; color:var(--ink-soft); }
.topbar-actions{ display:flex; gap:10px; align-items:center; }
.btn{ border:none; border-radius:999px; padding:10px 18px; font-weight:700; font-size:0.85rem; display:inline-flex; align-items:center; gap:8px; transition:0.2s; }
.btn-ghost{ background:var(--bg-alt); color:var(--ink); border:1px solid var(--line); }
.btn-ghost:hover{ background:var(--line); }
.btn-primary{ background:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-dark); }
.lang-switch{ display:flex; gap:4px; background:var(--bg-alt); border:1px solid var(--line); border-radius:999px; padding:3px; }
.lang-switch button{ padding:6px 11px; border-radius:999px; font-size:0.72rem; font-weight:800; color:var(--ink-soft); border:none; background:none; cursor:pointer; letter-spacing:0.02em; }
.lang-switch button.active{ background:var(--primary); color:#fff; }

/* tabs */
.tab-nav{ display:flex; gap:8px; margin-bottom:22px; }
.tab-btn{ border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft); padding:10px 18px; border-radius:999px; font-weight:700; font-size:0.88rem; display:inline-flex; align-items:center; gap:8px; }
.tab-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
.tab-badge{ background:var(--red); color:#fff; font-size:0.68rem; font-weight:800; border-radius:999px; padding:2px 7px; }

/* orders */
.order-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
.order-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
.order-card-id{ font-size:0.72rem; color:var(--ink-soft); font-weight:700; }
.order-card-time{ font-size:0.72rem; color:var(--ink-soft); }
.order-status-badge{ font-size:0.72rem; font-weight:800; padding:4px 11px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }
.status-new{ background:#FDECC8; color:#8A6714; }
.status-payment_requested{ background:#FFE4B8; color:#8A5A00; }
.status-paid{ background:var(--green-soft); color:var(--green); }
.status-accepted{ background:#DCE9FB; color:#2B5FA8; }
.status-preparing{ background:var(--primary-soft); color:var(--primary-dark); }
.status-ready{ background:var(--green-soft); color:var(--green); }
.status-completed{ background:var(--line); color:var(--ink-soft); }
.status-cancelled{ background:var(--red-soft); color:var(--red); }
.order-customer{ display:flex; gap:16px; flex-wrap:wrap; font-size:0.82rem; color:var(--ink-soft); font-weight:700; margin-bottom:10px; }
.order-customer i{ color:var(--primary-dark); margin-right:5px; }
.order-items-list{ font-size:0.86rem; color:var(--ink); margin-bottom:10px; }
.order-items-list div{ display:flex; justify-content:space-between; padding:3px 0; }
.order-item-note{ font-size:0.76rem; color:var(--primary-dark); font-style:italic; font-weight:500; margin-top:1px; }
.order-total-row{ display:flex; justify-content:space-between; font-weight:800; font-family:var(--font-display); font-size:1rem; padding-top:8px; border-top:1px solid var(--line); margin-bottom:12px; }
.order-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.order-action-btn{ border:none; border-radius:999px; padding:9px 16px; font-weight:700; font-size:0.82rem; }
.order-action-primary{ background:var(--primary); color:#fff; }
.order-action-primary:hover{ background:var(--primary-dark); }
.order-action-danger{ background:var(--red-soft); color:var(--red); }
.order-action-danger:hover{ background:var(--red); color:#fff; }

/* toolbar */
.toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
.toolbar h1{ font-size:1.4rem; }
.toolbar .count{ color:var(--ink-soft); font-size:0.85rem; font-weight:600; }
.btn-add{ background:var(--primary); color:#fff; padding:12px 20px; border-radius:999px; font-weight:800; }
.btn-add:hover{ background:var(--primary-dark); }

/* stats */
.stats-period{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.stats-period button{ border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft); padding:8px 16px; border-radius:999px; font-weight:700; font-size:0.82rem; }
.stats-period button.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
.stats-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-sm); }
.stat-card-label{ font-size:0.78rem; color:var(--ink-soft); font-weight:700; margin-bottom:6px; }
.stat-card-value{ font-family:var(--font-display); font-weight:800; font-size:1.5rem; color:var(--ink); }
.top-dish-row{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.top-dish-row:last-child{ margin-bottom:0; }
.top-dish-rank{ width:26px; height:26px; border-radius:50%; background:var(--primary-soft); color:var(--primary-dark); font-weight:800; font-size:0.8rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.top-dish-info{ flex:1; min-width:0; }
.top-dish-name{ font-weight:700; font-size:0.9rem; margin-bottom:5px; display:flex; justify-content:space-between; gap:8px; }
.top-dish-bar-track{ background:var(--bg-alt); border-radius:999px; height:8px; overflow:hidden; }
.top-dish-bar-fill{ background:var(--primary); height:100%; border-radius:999px; }
.top-dish-qty{ font-size:0.76rem; color:var(--ink-soft); white-space:nowrap; }

/* dish list */
.cat-group{ margin-bottom:30px; }
.cat-group h2{ font-size:1.05rem; margin-bottom:12px; display:flex; align-items:center; gap:9px; color:var(--ink); }
.cat-group h2 i{ color:var(--primary); font-size:0.95rem; }
.dish-row{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; display:flex; align-items:center; gap:14px; margin-bottom:10px; box-shadow:var(--shadow-sm); }
.dish-thumb{ width:60px; height:60px; border-radius:12px; overflow:hidden; flex-shrink:0; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; }
.dish-thumb img{ width:100%; height:100%; object-fit:cover; }
.dish-thumb i{ color:var(--primary-dark); opacity:0.5; font-size:1.3rem; }
.dish-row-info{ flex:1; min-width:0; }
.dish-row-name{ font-weight:700; font-family:var(--font-display); font-size:1rem; }
.dish-row-price{ color:var(--primary-dark); font-weight:800; font-size:0.88rem; }
.badges{ display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; }
.badge{ font-size:0.7rem; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em; }
.badge-pub{ background:var(--green-soft); color:var(--green); }
.badge-draft{ background:var(--line); color:var(--ink-soft); }
.badge-unavail{ background:var(--red-soft); color:var(--red); }
.dish-row-actions{ display:flex; gap:6px; flex-shrink:0; }
.icon-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:0.85rem; }
.icon-btn:hover{ background:var(--primary-soft); color:var(--primary-dark); border-color:var(--primary-soft); }
.icon-btn.danger:hover{ background:var(--red-soft); color:var(--red); border-color:var(--red-soft); }
.empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }

/* form modal */
.modal-overlay{ position:fixed; inset:0; background:rgba(46,42,36,0.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; opacity:0; pointer-events:none; transition:opacity 0.25s; }
.modal-overlay.open{ opacity:1; pointer-events:auto; }
.modal-card{ background:var(--bg-card); border-radius:var(--radius-lg); width:100%; max-width:520px; max-height:90vh; overflow-y:auto; }
.modal-head{ padding:22px 24px 14px; display:flex; align-items:center; justify-content:space-between; }
.modal-head h3{ font-size:1.2rem; }
.modal-close{ width:34px; height:34px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; border:none; color:var(--ink-soft); }
.modal-body{ padding:0 24px 26px; }
.field{ margin-bottom:16px; }
.field label{ font-size:0.8rem; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:6px; }
.field input, .field select, .field textarea{ width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-family:inherit; font-size:0.92rem; color:var(--ink); }
.field textarea{ resize:vertical; min-height:70px; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.photo-upload{ border:1.5px dashed var(--line); border-radius:var(--radius-sm); padding:14px; display:flex; align-items:center; gap:14px; cursor:pointer; background:var(--bg); }
.photo-upload:hover{ border-color:var(--primary); }
.photo-preview{ width:64px; height:64px; border-radius:10px; overflow:hidden; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.photo-preview img{ width:100%; height:100%; object-fit:cover; }
.photo-preview i{ color:var(--primary-dark); opacity:0.5; }
.photo-upload-text{ font-size:0.82rem; color:var(--ink-soft); }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line); }
.toggle-row:first-of-type{ border-top:none; }
.toggle-row-label{ font-weight:700; font-size:0.88rem; }
.toggle-row-sub{ font-size:0.76rem; color:var(--ink-soft); margin-top:2px; }
.switch{ position:relative; width:44px; height:26px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.slider{ position:absolute; inset:0; background:var(--line); border-radius:999px; transition:0.2s; cursor:pointer; }
.slider::before{ content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:0.2s; box-shadow:var(--shadow-sm); }
input:checked + .slider{ background:var(--primary); }
input:checked + .slider::before{ transform:translateX(18px); }
.form-error{ background:var(--red-soft); color:var(--red); border-radius:10px; padding:10px 12px; font-size:0.82rem; margin-bottom:16px; display:none; }
.form-error.show{ display:block; }
.modal-actions{ display:flex; gap:10px; margin-top:6px; }
.btn-cancel{ flex:1; padding:13px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg); font-weight:700; color:var(--ink); }
.btn-save{ flex:2; padding:13px; border-radius:var(--radius-sm); border:none; background:var(--primary); color:#fff; font-weight:800; }
.btn-save:hover{ background:var(--primary-dark); }
.btn-save:disabled{ background:#D8CFC2; cursor:not-allowed; }

/* toast */
.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:13px 22px; border-radius:999px; font-size:0.85rem; font-weight:700; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:0.25s; z-index:200; display:flex; align-items:center; gap:9px; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast i{ color:#8FD19E; }
</style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <div class="topbar-brand">
      <div class="topbar-mark">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <path d="M78,88 C72,77 84,71 78,58" stroke="#8B0000" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
          <path d="M100,84 C94,71 106,64 100,50" stroke="#8B0000" stroke-width="6.5" stroke-linecap="round" fill="none"/>
          <path d="M122,88 C116,77 128,71 122,58" stroke="#8B0000" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
          <path d="M56,108 C56,108 62,148 100,148 C138,148 144,108 144,108 Z" fill="#8B0000"/>
          <ellipse cx="100" cy="108" rx="44" ry="10" fill="#8B0000"/>
        </svg>
      </div>
      <div>
        <div class="topbar-title">Дастархан — админка</div>
        <div class="topbar-sub" id="staffLabel">меню</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="lang-switch" id="adminLangSwitch">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="ky">KY</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a href="index.html" class="btn btn-ghost"><i class="fa-solid fa-arrow-up-right-from-square"></i> <span data-i18n="openSite">Открыть сайт</span></a>
      <button class="btn btn-ghost" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="logout">Выйти</span></button>
    </div>
  </div>
</div>

<div class="container">
  <div class="tab-nav">
    <button class="tab-btn active" data-tab="menu"><i class="fa-solid fa-utensils"></i> <span data-i18n="tabMenu">Меню</span></button>
    <button class="tab-btn" data-tab="orders"><i class="fa-solid fa-receipt"></i> <span data-i18n="tabOrders">Заказы</span> <span class="tab-badge" id="newOrdersBadge" style="display:none;"></span></button>
    <button class="tab-btn" data-tab="stats"><i class="fa-solid fa-chart-column"></i> <span data-i18n="tabStats">Статистика</span></button>
  </div>

  <div id="menuTab">
    <div class="toolbar">
      <div>
        <h1>Блюда и напитки</h1>
        <div class="count" id="dishCount"></div>
      </div>
      <button class="btn btn-add" id="addDishBtn"><i class="fa-solid fa-plus"></i> Добавить блюдо</button>
    </div>

    <div id="dishList"><div class="empty-state">Загрузка…</div></div>
  </div>

  <div id="ordersTab" style="display:none;">
    <div class="toolbar">
      <div>
        <h1 data-i18n="tabOrders">Заказы</h1>
        <div class="count" id="orderCount"></div>
      </div>
    </div>
    <div id="orderList"><div class="empty-state">Загрузка…</div></div>
  </div>

  <div id="statsTab" style="display:none;">
    <div class="toolbar">
      <div>
        <h1 data-i18n="tabStats">Статистика</h1>
      </div>
    </div>
    <div class="stats-period">
      <button class="active" data-period="today" data-i18n="periodToday">Сегодня</button>
      <button data-period="week" data-i18n="periodWeek">7 дней</button>
      <button data-period="month" data-i18n="periodMonth">30 дней</button>
      <button data-period="all" data-i18n="periodAll">Всё время</button>
    </div>
    <div class="stats-cards">
      <div class="stat-card">
        <div class="stat-card-label" data-i18n="statRevenueLabel">Выручка</div>
        <div class="stat-card-value" id="statRevenue">0 сом</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label" data-i18n="statOrdersLabel">Заказов</div>
        <div class="stat-card-value" id="statOrders">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label" data-i18n="statAvgLabel">Средний чек</div>
        <div class="stat-card-value" id="statAvg">0 сом</div>
      </div>
    </div>
    <div class="order-card">
      <h3 style="margin-bottom:16px;font-size:1.05rem;" data-i18n="topDishesTitle">Топ продаж</h3>
      <div id="topDishList"></div>
    </div>
  </div>
</div>

<!-- Форма добавления/редактирования -->
<div class="modal-overlay" id="formModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="formTitle">Новое блюдо</h3>
      <button class="modal-close" id="formClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-error" id="formError"></div>
      <form id="dishForm">
        <div class="field">
          <label>Фото блюда</label>
          <label class="photo-upload">
            <div class="photo-preview" id="photoPreview"><i class="fa-solid fa-image" style="font-size:1.4rem;"></i></div>
            <div class="photo-upload-text">Нажмите, чтобы выбрать фото<br>(JPG/PNG, до 5 МБ)</div>
            <input type="file" accept="image/*" id="photoInput" style="display:none;">
          </label>
        </div>
        <div class="field">
          <label for="dishCategory">Категория</label>
          <select id="dishCategory" required></select>
        </div>
        <div class="field">
          <label for="dishName">Название</label>
          <input type="text" id="dishName" required placeholder="Например: Плов">
        </div>
        <div class="field">
          <label for="dishDesc">Описание / состав</label>
          <textarea id="dishDesc" placeholder="Из чего состоит блюдо"></textarea>
        </div>
        <div class="field">
          <label for="dishPrice">Цена (сом)</label>
          <input type="number" id="dishPrice" min="0" step="1" required placeholder="250">
        </div>
        <div class="toggle-row">
          <div>
            <div class="toggle-row-label">В наличии</div>
            <div class="toggle-row-sub">Если выключено — гости увидят «нет в наличии»</div>
          </div>
          <label class="switch"><input type="checkbox" id="dishAvailable" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
          <div>
            <div class="toggle-row-label">Опубликовано</div>
            <div class="toggle-row-sub">Показывать это блюдо на сайте прямо сейчас</div>
          </div>
          <label class="switch"><input type="checkbox" id="dishPublished" checked><span class="slider"></span></label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="formCancel">Отмена</button>
          <button type="submit" class="btn-save" id="formSave">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastText"></span></div>

<script>

let CATEGORIES = [];
let DISHES = [];
let editingId = null;
let selectedFile = null;

/* ---------- auth guard ---------- */
async function guardAuth(){
  if(!supabaseClient){
    document.getElementById("dishList").innerHTML = '<div class="empty-state">Не удалось загрузить библиотеку подключения к базе. Проверьте интернет-соединение и обновите страницу.</div>';
    return null;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){ window.location.href = "admin-login.html"; return null; }
  const { data: staffRow } = await supabaseClient.from("staff").select("*").eq("id", session.user.id).maybeSingle();
  if(!staffRow){ window.location.href = "admin-login.html"; return null; }
  document.getElementById("staffLabel").textContent = staffRow.full_name ? `меню · ${staffRow.full_name}` : "меню";
  return staffRow;
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  if(supabaseClient) await supabaseClient.auth.signOut();
  window.location.href = "admin-login.html";
});

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(text){
  const toast = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove("show"), 2600);
}

/* ---------- load data ---------- */
async function loadData(){
  const [{ data: cats }, { data: dishes, error }] = await Promise.all([
    supabaseClient.from("categories").select("*").order("sort_order"),
    supabaseClient.from("dishes").select("*").order("sort_order")
  ]);
  CATEGORIES = cats || [];
  DISHES = dishes || [];
  if(error){
    document.getElementById("dishList").innerHTML = `<div class="empty-state">Не удалось загрузить блюда: ${escapeHtml(error.message)}</div>`;
    return;
  }
  renderCategorySelect();
  renderList();
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = String(str);
  return div.innerHTML;
}

function renderCategorySelect(){
  const sel = document.getElementById("dishCategory");
  sel.innerHTML = CATEGORIES.map(c=> `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
}

/* ---------- render dish list ---------- */
function renderList(){
  const listEl = document.getElementById("dishList");
  document.getElementById("dishCount").textContent = `Всего блюд: ${DISHES.length}`;

  if(!DISHES.length){
    listEl.innerHTML = `<div class="empty-state"><i class="fa-solid fa-utensils" style="font-size:1.8rem;display:block;margin-bottom:12px;"></i>Пока нет ни одного блюда — добавьте первое</div>`;
    return;
  }

  listEl.innerHTML = CATEGORIES.map(cat=>{
    const items = DISHES.filter(d=>d.category_id===cat.id);
    if(!items.length) return "";
    return `
      <div class="cat-group">
        <h2><i class="fa-solid ${cat.icon||'fa-utensils'}"></i>${escapeHtml(cat.name)} <span style="color:var(--ink-soft);font-weight:600;font-size:0.85rem;">(${items.length})</span></h2>
        ${items.map(dishRowHTML).join("")}
      </div>
    `;
  }).join("");

  listEl.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click", ()=> openForm(btn.dataset.edit));
  });
  listEl.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.addEventListener("click", ()=> deleteDish(btn.dataset.delete));
  });
  listEl.querySelectorAll(".dish-thumb img").forEach(img=>{
    img.addEventListener("error", function(){ this.replaceWith(Object.assign(document.createElement("i"), { className:"fa-solid fa-image" })); }, { once:true });
  });
}

function dishRowHTML(d){
  return `
    <div class="dish-row">
      <div class="dish-thumb">${d.photo_url ? `<img src="${d.photo_url}" alt="">` : '<i class="fa-solid fa-image"></i>'}</div>
      <div class="dish-row-info">
        <div class="dish-row-name">${escapeHtml(d.name)}</div>
        <div class="dish-row-price">${Number(d.price)} сом</div>
        <div class="badges">
          ${d.is_published ? '<span class="badge badge-pub">Опубликовано</span>' : '<span class="badge badge-draft">Черновик</span>'}
          ${d.is_available ? '' : '<span class="badge badge-unavail">Нет в наличии</span>'}
        </div>
      </div>
      <div class="dish-row-actions">
        <button class="icon-btn" data-edit="${d.id}" aria-label="Редактировать"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-btn danger" data-delete="${d.id}" aria-label="Удалить"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
  `;
}

/* ---------- form modal ---------- */
const formModal = document.getElementById("formModal");
const dishForm = document.getElementById("dishForm");
const formError = document.getElementById("formError");
const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");

document.getElementById("addDishBtn").addEventListener("click", ()=> openForm(null));
document.getElementById("formClose").addEventListener("click", closeForm);
document.getElementById("formCancel").addEventListener("click", closeForm);
formModal.addEventListener("click", (e)=>{ if(e.target===formModal) closeForm(); });

function openForm(id){
  editingId = id;
  selectedFile = null;
  formError.classList.remove("show");
  dishForm.reset();
  photoPreview.innerHTML = '<i class="fa-solid fa-image" style="font-size:1.4rem;"></i>';

  if(id){
    const d = DISHES.find(x=>x.id===id);
    document.getElementById("formTitle").textContent = "Редактировать блюдо";
    document.getElementById("dishCategory").value = d.category_id;
    document.getElementById("dishName").value = d.name;
    document.getElementById("dishDesc").value = d.description || "";
    document.getElementById("dishPrice").value = d.price;
    document.getElementById("dishAvailable").checked = d.is_available;
    document.getElementById("dishPublished").checked = d.is_published;
    if(d.photo_url) photoPreview.innerHTML = `<img src="${d.photo_url}" alt="">`;
  } else {
    document.getElementById("formTitle").textContent = "Новое блюдо";
    document.getElementById("dishAvailable").checked = true;
    document.getElementById("dishPublished").checked = true;
    if(CATEGORIES.length) document.getElementById("dishCategory").value = CATEGORIES[0].id;
  }
  formModal.classList.add("open");
}
function closeForm(){ formModal.classList.remove("open"); }

photoInput.addEventListener("change", ()=>{
  const file = photoInput.files[0];
  if(!file) return;
  if(file.size > 5*1024*1024){ formError.textContent = "Файл больше 5 МБ — выберите фото поменьше."; formError.classList.add("show"); return; }
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = (e) => { photoPreview.innerHTML = `<img src="${e.target.result}" alt="">`; };
  reader.readAsDataURL(file);
});
dishForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  formError.classList.remove("show");
  const saveBtn = document.getElementById("formSave");
  saveBtn.disabled = true;
  saveBtn.textContent = "Сохраняем…";

  try{
    let photoUrl = editingId ? (DISHES.find(x=>x.id===editingId)||{}).photo_url : null;

    if(selectedFile){
      const ext = (selectedFile.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
      const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error: upErr } = await supabaseClient.storage.from(PHOTO_BUCKET).upload(path, selectedFile, { upsert:false });
      if(upErr) throw new Error("Не удалось загрузить фото: " + upErr.message);
      const { data: pub } = supabaseClient.storage.from(PHOTO_BUCKET).getPublicUrl(path);
      photoUrl = pub.publicUrl;
    }

    const payload = {
      category_id: document.getElementById("dishCategory").value,
      name: document.getElementById("dishName").value.trim(),
      description: document.getElementById("dishDesc").value.trim(),
      price: Number(document.getElementById("dishPrice").value),
      photo_url: photoUrl,
      is_available: document.getElementById("dishAvailable").checked,
      is_published: document.getElementById("dishPublished").checked
    };

    let saveErr;
    if(editingId){
      ({ error: saveErr } = await supabaseClient.from("dishes").update(payload).eq("id", editingId));
    } else {
      ({ error: saveErr } = await supabaseClient.from("dishes").insert(payload));
    }
    if(saveErr) throw new Error(saveErr.message);

    closeForm();
    showToast(editingId ? "Блюдо обновлено" : "Блюдо добавлено");
    await loadData();
  } catch(err){
    formError.textContent = err.message || "Не удалось сохранить блюдо";
    formError.classList.add("show");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Сохранить";
  }
});

async function deleteDish(id){
  const d = DISHES.find(x=>x.id===id);
  if(!d) return;
  if(!confirm(`Удалить блюдо «${d.name}»? Это действие нельзя отменить.`)) return;
  const { error } = await supabaseClient.from("dishes").delete().eq("id", id);
  if(error){ showToast("Ошибка удаления: " + error.message); return; }
  showToast("Блюдо удалено");
  await loadData();
}

/* ---------- orders ----------
   Статусы: new -> payment_requested -> paid -> accepted -> preparing -> ready -> completed (или cancelled)
   «Запросить оплату» и «Готово» не просто меняют статус — они ещё открывают WhatsApp
   с готовым текстом (клиенту), администратору остаётся нажать «отправить» в самом WhatsApp. */
function orderStatusLabel(status){ return at("status_"+status) || status; }
function getOrderNext(status){
  const map = {
    new: [{action:"request_payment", label:at("action_request_payment"), cls:"order-action-primary"}, {to:"cancelled", label:at("action_cancel"), cls:"order-action-danger"}],
    payment_requested: [{action:"confirm_payment", label:at("action_confirm_payment"), cls:"order-action-primary"}, {to:"cancelled", label:at("action_cancel"), cls:"order-action-danger"}],
    paid: [{to:"accepted", label:at("action_accept"), cls:"order-action-primary"}, {to:"cancelled", label:at("action_cancel"), cls:"order-action-danger"}],
    accepted: [{to:"preparing", label:at("action_preparing"), cls:"order-action-primary"}, {to:"cancelled", label:at("action_cancel"), cls:"order-action-danger"}],
    preparing: [{action:"mark_ready", label:at("action_ready"), cls:"order-action-primary"}],
    ready: [{to:"completed", label:at("action_complete"), cls:"order-action-primary"}],
    completed: [], cancelled: []
  };
  return map[status] || [];
}
let ORDERS = [];
let ORDER_ITEMS_BY_ORDER = {};
let newOrdersSinceView = 0;

async function loadOrders(){
  const [{ data: orders, error: ordErr }, { data: items }] = await Promise.all([
    supabaseClient.from("orders").select("*").order("created_at", { ascending:false }).limit(100),
    supabaseClient.from("order_items").select("*")
  ]);
  if(ordErr){
    document.getElementById("orderList").innerHTML = `<div class="empty-state">Не удалось загрузить заказы: ${escapeHtml(ordErr.message)}</div>`;
    return;
  }
  ORDERS = orders || [];
  ORDER_ITEMS_BY_ORDER = {};
  (items||[]).forEach(it=>{
    if(!ORDER_ITEMS_BY_ORDER[it.order_id]) ORDER_ITEMS_BY_ORDER[it.order_id] = [];
    ORDER_ITEMS_BY_ORDER[it.order_id].push(it);
  });
  renderOrders();
  renderStats();
}

/* ---------- статистика (топ продаж, выручка за период) ---------- */
let statsPeriod = "today";
function ordersInPeriod(period){
  const now = new Date();
  return ORDERS.filter(o=>{
    if(o.status === "cancelled") return false;
    if(!o.created_at) return false;
    const d = new Date(o.created_at);
    if(period === "today") return d.toDateString() === now.toDateString();
    if(period === "week"){ const from = new Date(now); from.setDate(from.getDate()-7); return d >= from; }
    if(period === "month"){ const from = new Date(now); from.setDate(from.getDate()-30); return d >= from; }
    return true;
  });
}
function renderStats(){
  const revenueEl = document.getElementById("statRevenue");
  if(!revenueEl) return;
  const orders = ordersInPeriod(statsPeriod);
  const revenue = orders.reduce((s,o)=> s + Number(o.total||0), 0);
  const count = orders.length;
  const avg = count ? Math.round(revenue/count) : 0;
  revenueEl.textContent = revenue.toLocaleString("ru-RU") + " сом";
  document.getElementById("statOrders").textContent = String(count);
  document.getElementById("statAvg").textContent = avg.toLocaleString("ru-RU") + " сом";

  const dishTotals = {};
  orders.forEach(o=>{
    (ORDER_ITEMS_BY_ORDER[o.id]||[]).forEach(it=>{
      if(!dishTotals[it.dish_name]) dishTotals[it.dish_name] = { qty:0 };
      dishTotals[it.dish_name].qty += Number(it.qty||0);
    });
  });
  const top = Object.entries(dishTotals).sort((a,b)=> b[1].qty - a[1].qty).slice(0,5);
  const maxQty = top.length ? top[0][1].qty : 1;
  const topListEl = document.getElementById("topDishList");
  topListEl.innerHTML = top.length ? top.map(([name, d], i)=> `
    <div class="top-dish-row">
      <div class="top-dish-rank">${i+1}</div>
      <div class="top-dish-info">
        <div class="top-dish-name"><span>${escapeHtml(name)}</span><span class="top-dish-qty">${d.qty} ${at("pcsLabel")}</span></div>
        <div class="top-dish-bar-track"><div class="top-dish-bar-fill" style="width:${Math.round((d.qty/maxQty)*100)}%"></div></div>
      </div>
    </div>
  `).join("") : `<div class="empty-state">${at("noSalesYet")}</div>`;
}

function renderOrders(){
  const listEl = document.getElementById("orderList");
  document.getElementById("orderCount").textContent = `${at("ordersCount")}: ${ORDERS.length}`;
  if(!ORDERS.length){
    listEl.innerHTML = `<div class="empty-state"><i class="fa-solid fa-receipt" style="font-size:1.8rem;display:block;margin-bottom:12px;"></i>${at("noOrders")}</div>`;
    return;
  }
  listEl.innerHTML = ORDERS.map(orderCardHTML).join("");
  listEl.querySelectorAll("[data-status-to]").forEach(btn=>{
    btn.addEventListener("click", ()=> updateOrderStatus(btn.dataset.orderId, btn.dataset.statusTo));
  });
  listEl.querySelectorAll("[data-action]").forEach(btn=>{
    btn.addEventListener("click", ()=> runOrderAction(btn.dataset.action, btn.dataset.orderId));
  });
}

function orderCardHTML(o){
  const items = ORDER_ITEMS_BY_ORDER[o.id] || [];
  const time = o.created_at ? new Date(o.created_at).toLocaleString("ru-RU", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "";
  const actions = getOrderNext(o.status);
  return `
    <div class="order-card">
      <div class="order-card-top">
        <div>
          <div class="order-card-id">№${escapeHtml(String(o.id).slice(0,8))}</div>
          <div class="order-card-time">${time}</div>
        </div>
        <span class="order-status-badge status-${o.status}">${orderStatusLabel(o.status)}</span>
      </div>
      ${(o.customer_name || o.customer_contact) ? `<div class="order-customer">
        ${o.customer_name ? `<span><i class="fa-solid fa-user"></i> ${escapeHtml(o.customer_name)}</span>` : ""}
        ${o.customer_contact ? `<span><i class="fa-solid fa-phone"></i> ${escapeHtml(o.customer_contact)}</span>` : ""}
      </div>` : ""}
      <div class="order-items-list">
        ${items.map(it=>`<div><span>${escapeHtml(it.dish_name)} × ${it.qty}${it.note ? `<div class="order-item-note"><i class="fa-solid fa-pen"></i> ${escapeHtml(it.note)}</div>` : ""}</span><span>${Number(it.price)*it.qty} сом</span></div>`).join("") || `<div style="color:var(--ink-soft);">${at("noItems")}</div>`}
      </div>
      <div class="order-total-row"><span>${at("totalLabel")}</span><span>${Number(o.total)} сом</span></div>
      ${actions.length ? `<div class="order-actions">${actions.map(a=>
        a.action
          ? `<button class="order-action-btn ${a.cls}" data-order-id="${o.id}" data-action="${a.action}">${a.label}</button>`
          : `<button class="order-action-btn ${a.cls}" data-order-id="${o.id}" data-status-to="${a.to}">${a.label}</button>`
      ).join("")}</div>` : ""}
    </div>
  `;
}

async function updateOrderStatus(orderId, newStatus){
  const { error } = await supabaseClient.from("orders").update({ status:newStatus }).eq("id", orderId);
  if(error){ showToast("Ошибка: " + error.message); return; }
  showToast("Статус обновлён");
  await loadOrders();
}

/* ---------- действия «Запросить оплату» / «Подтвердить оплату» / «Готово» ----------
   Открывают WhatsApp клиента с готовым текстом — администратору остаётся нажать «отправить». */
function buildPaymentRequestMessage(order, items){
  const shortId = String(order.id).slice(0,8);
  let text = `Здравствуйте! Это ${CAFE_NAME}.\nВаш заказ №${shortId} принят, вот что вы заказали:\n\n`;
  items.forEach(it=>{
    text += `• ${it.dish_name} × ${it.qty} — ${Number(it.price)*it.qty} сом\n`;
  });
  text += `\nИтого к оплате: ${Number(order.total)} сом.\n`;
  text += `Переводом на номер ${PAYMENT_PHONE} (получатель: ${PAYMENT_RECIPIENT_NAME}).\n`;
  text += `Пожалуйста, отправьте чек после оплаты — как только получим, сразу начнём готовить.`;
  return text;
}

function buildOrderReadyMessage(order){
  const shortId = String(order.id).slice(0,8);
  return `Ваш заказ №${shortId} в ${CAFE_NAME} готов! Можете забирать по адресу: ${CAFE_ADDRESS}. Ждём вас 🙂`;
}

function openWhatsAppWithText(phone, text){
  const digits = String(phone||"").replace(/[^\d]/g, "");
  const url = `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
}

async function runOrderAction(action, orderId){
  const order = ORDERS.find(o=> String(o.id)===String(orderId));
  if(!order) return;
  const items = ORDER_ITEMS_BY_ORDER[order.id] || [];

  if(action === "request_payment"){
    if(!order.customer_contact){ showToast("У заказа нет номера телефона клиента"); return; }
    openWhatsAppWithText(order.customer_contact, buildPaymentRequestMessage(order, items));
    await updateOrderStatus(order.id, "payment_requested");
    return;
  }
  if(action === "confirm_payment"){
    await updateOrderStatus(order.id, "paid");
    return;
  }
  if(action === "mark_ready"){
    if(order.customer_contact) openWhatsAppWithText(order.customer_contact, buildOrderReadyMessage(order));
    await updateOrderStatus(order.id, "ready");
    return;
  }
}

function subscribeOrdersRealtime(){
  supabaseClient.channel("admin-orders-changes")
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"orders" }, () => {
      if(document.getElementById("ordersTab").style.display === "none"){
        newOrdersSinceView++;
        const badge = document.getElementById("newOrdersBadge");
        badge.textContent = newOrdersSinceView;
        badge.style.display = "inline-block";
      }
      showToast("Новый заказ!");
      loadOrders();
    })
    .on("postgres_changes", { event:"UPDATE", schema:"public", table:"orders" }, () => loadOrders())
    .on("postgres_changes", { event:"*", schema:"public", table:"order_items" }, () => loadOrders())
    .subscribe();
}

/* ---------- init ---------- */
applyAdminTranslations();
(async () => {
  const staff = await guardAuth();
  if(!staff) return;
  await loadData();
  await loadOrders();
  subscribeOrdersRealtime();
})();
</script>
